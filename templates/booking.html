{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container mt-4">

    <h1 class="text-center text-warning">
        🎟 Movie Seat Booking
    </h1>

    <hr>

    <div class="text-center mb-4">
        <div class="bg-secondary text-white p-2 rounded">
            <h4>SCREEN</h4>
        </div>
    </div>

    <!-- Seat Legend -->

    <div class="text-center mb-4">

        <button class="btn btn-outline-secondary btn-sm" disabled>
            Available
        </button>

        <button class="btn btn-success btn-sm" disabled>
            Selected
        </button>

        <button class="btn btn-danger btn-sm" disabled>
            Booked
        </button>

    </div>

    <!-- Seat Grid -->

    <div id="seat-container" class="text-center mb-4"></div>

    <hr>

    <div class="row">

        <div class="col-md-6">

            <h5>
                Selected Seats :
                <span id="selectedSeats">None</span>
            </h5>

        </div>

        <div class="col-md-6 text-end">

            <h5>
                Total Price :
                $<span id="price">0</span>
            </h5>

        </div>

    </div>

    <hr>

    {% if error %}

    <div class="alert alert-danger">

        {{ error }}

    </div>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <input
            type="hidden"
            id="seat_numbers"
            name="seat_numbers">

        <input
            type="hidden"
            id="total_paid"
            name="total_paid">

        <div class="mt-3">

            <button type="submit"
                    class="btn btn-success">

                Confirm Booking

            </button>

            <a href="{% url 'home' %}"
               class="btn btn-secondary">

                Back to Home

            </a>

        </div>

    </form>

</div>

<script>
    const bookedSeats = {{ booked_seats|default:"[]"|safe }};
</script>

<script src="{% static 'js/seats.js' %}"></script>

{% endblock %}
